name: Bug report
description: The script failed, printed an error, or a listed ghost device was not removed / came back without the hardware being plugged in.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not a bug:** a removed device reappearing after you plug the hardware back in (Windows re-detects it), or its driver package still sitting in the DriverStore (the script removes devices, not drivers) - both are explained in the [FAQ](https://github.com/vadyaravadim/remove-hidden-devices#faq) and [Full Cleanup](https://github.com/vadyaravadim/remove-hidden-devices#full-cleanup-leftover-drivers).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: run-output
    attributes:
      label: Output of the run
      description: |
        Everything the elevated window printed, from the `REMOVE HIDDEN DEVICES vX.Y.Z` banner down, including any ERROR line - the banner says which version you ran. If the window closed before you could copy it, run the script again from a console so the output stays, and answer `N` at the confirmation if you do not want to remove anything:
        - PowerShell Gallery: `remove-hidden-devices`
        - One-liner: `powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE\remove-hidden-devices.ps1"`
        - ZIP / clone, from the script's folder: `powershell -ExecutionPolicy Bypass -File .\remove-hidden-devices.ps1`
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and how it showed in Device Manager
      description: The device the report is about, as the script listed it, and whether Device Manager showed it greyed out (hidden) or as present.
      placeholder: USB Composite Device - greyed out under Show hidden devices
  - type: dropdown
    id: launch-method
    attributes:
      label: How did you run it?
      description: Each method reaches the script through a different relaunch path, and that is where launch bugs live.
      options:
        - PowerShell Gallery (Install-Script)
        - irm | iex one-liner
        - Run.bat from the ZIP
        - .ps1 directly (clone or download)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display language
      description: Win+R, `winver`. The display language matters - device names in the list and the output are localized.
      placeholder: Windows 11 24H2, build 26100.4061, German
    validations:
      required: true
